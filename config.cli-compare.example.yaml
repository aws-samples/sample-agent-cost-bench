# cli-compare — run coding CLIs against the same vibe tasks and compare cost.
#
#   agent-cost-bench cli-compare run config.cli-compare.example.yaml
#
# Authentication: each CLI reads its API key from its own auth mechanism.
# Log in to each CLI before running the benchmark:
#
#   kiro login                       # Kiro
#   claude login                     # Claude Code (or export ANTHROPIC_API_KEY)
#   copilot auth login               # GitHub Copilot
#   cursor login  (or agent login)   # Cursor (stores token in macOS Keychain;
#                                    #   CURSOR_API_KEY env var alone is NOT sufficient)
#   codex auth login                 # Codex (or export OPENAI_API_KEY)
#   agy login                        # Antigravity
#   devin auth login                 # Devin
#   pi auth check --provider <name> --json
#                                    # pi (uses the PROVIDER's own credentials —
#                                    #   AWS creds for amazon-bedrock, etc.;
#                                    #   expect "status":"ready")
#
# The harness inherits the parent shell's environment, so all CLIs pick up
# their keys automatically — no per-runner `env:` block needed.
#
# One inherited variable does need attention, because it silently skews results
# rather than failing: CLAUDE_CODE_USE_BEDROCK=1 (env var or
# .claude/settings.local.json) routes Claude Code through Bedrock, which serves
# a 200K context window where the first-party API and the other CLIs serve 1M.
# A large-context task then dies with "Prompt is too long" after being billed in
# full, and the harness records that as a score of 0.0 — reading as a model
# weakness when it is a provider difference. Pin it per runner if any CLI in the
# comparison is on a different provider:
#
#   env:
#     CLAUDE_CODE_USE_BEDROCK: "0"        # 0, not unset: env vars can only be
#     ANTHROPIC_MODEL: claude-opus-5      #   added to the inherited environment
#
# Confirm with --output-format json, which reports contextWindow and provider
# per model, before trusting a cross-provider comparison.
#
# `comparison_label` is a reporting headline only — it names what this run
# compares. Optional; defaults to "cross-CLI comparison".
#
# cost_source is inferred automatically from the binary name:
#   kiro / kiro-cli  → kiro_credits
#   claude           → claude_json
#   copilot          → copilot_json
#   codex            → codex_json
#   cursor           → cursor_json
#   agy / antigravity → antigravity_json
#   opencode         → opencode_json
#   devin            → devin_export
#   pi               → pi_json
# You can still set it explicitly if needed, but in most cases it's not required.

comparison_label: Opus 4.8 (Kiro / Claude Code / Copilot / Cursor / Devin ) vs Gemini 3.8 Flash in Antigravity)

# LLM-as-judge for rubric tasks (optional — only needed if task_ids includes
# rubric tasks like bedrock-sentiment that have quality.rubric).
# judge_model: claude-opus-4.8
# judge_cli_path: kiro-cli
# judge_weight: 0.6

runners:
  # ── Kiro CLI (claude-opus-4.8) ────────────────────────────────────────────
  - name: kiro
    display_name: "Kiro (claude-opus-4.8)"
    cli_path: kiro-cli
    model_id: claude-opus-4.8
    pricing:
      usd_per_credit: 0.04
    cli_base_args: [chat, --no-interactive, --trust-all-tools,
                    "--model={model}", "--effort={effort}"]

  # ── Claude Code (claude-opus-4.8) ─────────────────────────────────────────
  # cost is read directly from --output-format json (total_cost_usd field)
  - name: claude-code
    display_name: "Claude Code (claude-opus-4.8)"
    cli_path: claude
    model_id: us.anthropic.claude-opus-4-8
    cli_base_args: ["-p", "{prompt}", "--output-format", "json",
                    "--model", "{model}", "--dangerously-skip-permissions",
                    "--effort", "{effort}"]

  # ── GitHub Copilot (claude-opus-4.8) ──────────────────────────────────────
  # No pricing config needed: cost comes from Copilot's AI-credit (AIU)
  # telemetry (1 AIU = $0.01), read from the JSON output. When no AIU data is
  # present, cost is reported as unknown rather than guessed.
  - name: copilot
    display_name: "GitHub Copilot (claude-opus-4.8)"
    cli_path: copilot
    model_id: claude-opus-4.8
    cli_base_args: ["-p", "{prompt}", "--model", "{model}",
                    "--allow-all-tools", "--output-format", "json",
                    "--effort", "{effort}"]

  # ── Cursor (claude-opus-4.8-thinking-max) ─────────────────────────────────
  # Cursor encodes effort/thinking as part of the model slug, not a separate
  # flag. The harness automatically appends the task's effort level to the
  # model_id below (e.g. model_id "claude-opus-4-8" + effort "high" →
  # "claude-opus-4-8-high"). If you bake the effort into model_id yourself
  # (e.g. "claude-opus-4-8-thinking-max"), no suffix is appended.
  #
  # Model slug reference (Opus 4.8):
  #   claude-opus-4-8-low               = Low
  #   claude-opus-4-8-medium            = Medium
  #   claude-opus-4-8-high              = High (default)
  #   claude-opus-4-8-xhigh            = Extra High
  #   claude-opus-4-8-max               = Max
  #   claude-opus-4-8-thinking-low      = Low Thinking
  #   claude-opus-4-8-thinking-medium   = Medium Thinking
  #   claude-opus-4-8-thinking-xhigh   = Extra High Thinking
  #   claude-opus-4-8-thinking-max      = Max Thinking
  #   Append "-fast" for fast variants
  #
  # Pricing: from https://cursor.com/docs/models-and-pricing (API pool)
  # Opus 4.8: Input $5/M, Cache Write $6.25/M, Cache Read $0.50/M, Output $25/M
  - name: cursor
    display_name: "Cursor (claude-opus-4.8)"
    cli_path: agent
    model_id: claude-opus-4-8
    cost_source: cursor_json
    pricing:
      usd_per_input_token:        0.000005     # $5.00  / 1M (fresh input)
      usd_per_cache_write_token:  0.00000625   # $6.25  / 1M (cache write)
      usd_per_cached_input_token: 0.0000005    # $0.50  / 1M (cache read)
      usd_per_output_token:       0.000025     # $25.00 / 1M
    capabilities:
      requires_pty: true
    cli_base_args: ["-p", "{prompt}", "--trust","--yolo", "--output-format", "json",
                    "--model", "{model}"]

  # ── Antigravity (gemini) ──────────────────────────────────────────────────
  # `agy -p "<prompt>" --output-format json` prints a single JSON result object
  # with a `usage` block: input_tokens, output_tokens, thinking_tokens,
  # cache_read_tokens, total_tokens — plus a top-level duration_seconds.
  #
  # Token semantics (priced like Cursor/Codex):
  #   input_tokens      → fresh (non-cached) input, billed at usd_per_input_token
  #   cache_read_tokens → cached input, billed at usd_per_cached_input_token
  #   output_tokens     → billed at usd_per_output_token
  #   thinking_tokens   → reasoning; a SUBSET of output_tokens, NOT billed extra
  #
  # cost = input_tokens × in_rate + cache_read_tokens × cached_rate
  #      + output_tokens × out_rate
  #
  # Effort: like Cursor and Devin, Antigravity bakes the reasoning effort into
  # the model slug rather than taking a separate --effort flag. `agy models`
  # lists ids such as:
  #   gemini-3.8-flash-high / -medium / -low
  #   gemini-3.1-pro-high   / -low
  #   gpt-oss-120b-medium
  # So DON'T pass --effort here. Instead either:
  #   (a) set model_id to a full slug that already carries the effort
  #       (e.g. "gemini-3.8-flash-high"), or
  #   (b) set model_id to the base slug ("gemini-3.8-flash") and let the harness
  #       append the task's effort ("-high"/"-medium"/"-low") automatically — the
  #       same mechanism used for Cursor/Devin, which keeps a cross-CLI run fair.
  #
  # Other flags (from `agy --help`):
  #   --model <id>       model for the session; the harness substitutes {model}.
  #   --agent <name>     optional agent for the session (`agy agents` to list).
  #   --dangerously-skip-permissions  auto-approve tool calls so the coding task
  #                      isn't blocked waiting on an approval prompt in print mode.
  #
  # Pricing: Gemini 3.8 Flash introductory rates from Google's announcement
  # (https://blog.google/innovation-and-ai/models-and-research/gemini-models/3-8-flash-and-3-8-flash-cyber/,
  # Sep 2 2026): $0.75 / 1M input, $3.75 / 1M output. Rates are volatile and the
  # introductory price may change — verify against the current Gemini API
  # pricing page before trusting cost numbers. The announcement publishes no
  # cache-read rate, so usd_per_cached_input_token is left unset and cache reads
  # fall back to the full input rate; add it from the API pricing page (Gemini
  # cached input is typically 25% of the input rate) to avoid overstating cost.
  - name: antigravity
    display_name: "Antigravity (gemini-3.8-flash)"
    cli_path: agy
    model_id: gemini-3.8-flash   # base slug; harness appends the effort (-high/…)
    cost_source: antigravity_json
    pricing:
      usd_per_input_token:  0.00000075   # $0.75 / 1M (fresh input)
      usd_per_output_token: 0.00000375   # $3.75 / 1M
      # usd_per_cached_input_token:       # add from the Gemini API pricing page
    # IMPORTANT: agy ignores the process cwd and writes into its own managed
    # scratch dir (~/.gemini/antigravity-cli/...) unless the run workspace is
    # passed as an ABSOLUTE path via --add-dir. The harness substitutes the
    # {workspace} token with the run's absolute workspace path so the files the
    # model writes land where the verifier looks. A relative "." does NOT work —
    # agy resolves it against its scratch dir, not cwd.
    #
    # --print-timeout: agy's print mode aborts itself after 5m0s by default and
    # returns {"status":"ERROR","error":"timeout waiting for response"} with a
    # partial/empty result. Large tasks need longer, so raise it to comfortably
    # exceed the benchmark's `timeout_minutes` below (Go duration string, e.g.
    # "30m"). This is agy's OWN timeout — independent of the harness timeout.
    cli_base_args: ["-p", "{prompt}", "--output-format", "json",
                    "--model", "{model}", "--add-dir", "{workspace}",
                    "--print-timeout", "30m",
                    "--dangerously-skip-permissions"]
    # To pin a specific agent, add: "--agent", "{agent}" above.

  # ── Devin (claude-opus-4.8) ───────────────────────────────────────────────
  # Devin has no JSON output mode, but `--export <file>` writes an ATIF
  # conversation export whose `final_metrics` block carries cumulative token
  # counts. The export path is workspace-relative, so it lands inside the run's
  # own workspace; `pricing.devin_export_file` must match the --export filename.
  #
  # Like Cursor, Devin encodes the effort level in the model slug rather than a
  # separate flag, so the harness appends the task's effort to model_id
  # ("claude-opus-4-8" + "high" → "claude-opus-4-8-high"). Run `devin models
  # list` to see the slugs your account can use. Append "-fast" for the fast
  # variants (billed at 2× the standard rate).
  #
  # Permissions: Devin's non-interactive mode silently rejects any tool call
  # that needs approval, so the harness seeds each workspace with the scoped
  # allow/deny policy in `tasks/devin/config.json` (see devin_permissions_file
  # below) instead of using `--permission-mode dangerous`. That file allows
  # workspace reads/writes plus an explicit list of build/test commands, and
  # denies ~/.ssh, ~/.aws, credential files, sudo, ssh, git push, gh, and aws.
  # It allows the shell, so that deny list is a speed bump rather than a
  # boundary — containment is the disposable per-run workspace. See the header
  # of tasks/devin/config.json for the full reasoning.
  #
  # Workspace trust: print mode cannot show the interactive trust prompt and
  # aborts in an untrusted directory. Trust is inherited by child directories,
  # so run `devin` once interactively in your `workspace_base` and approve it —
  # every per-run workspace underneath is then trusted. Prefer that to passing
  # `--respect-workspace-trust false`, which disables the check globally for the
  # run; reach for the flag only where no one can approve interactively (CI).
  #
  # Pricing: from `devin models list` (standard, non-fast tiers)
  # Opus 4.8: Input $5/M, Output $25/M — i.e. Devin passes the provider's list
  # price through. The CLI publishes no cache-read rate (`devin models list
  # --format json` exposes only cost_summary), so use the provider's published
  # cache-read price: 10% of input, matching the Cursor block above for the same
  # underlying model. Cache reads are typically ~90% of prompt tokens in an
  # agentic run, so this rate — not the input rate — dominates reported cost;
  # leaving it unset bills cache reads at full input price and overstates Devin
  # by roughly 5x. total_prompt_tokens INCLUDES total_cached_tokens, so the
  # harness backs the cached portion out before applying the fresh-input rate.
  - name: devin
    display_name: "Devin (claude-opus-4.8)"
    cli_path: devin
    model_id: claude-opus-4-8
    pricing:
      usd_per_input_token:        0.000005     # $5.00  / 1M (fresh input)
      usd_per_cached_input_token: 0.0000005    # $0.50  / 1M (cache read, 10% of in)
      usd_per_output_token:       0.000025     # $25.00 / 1M
      devin_export_file: devin-usage.json      # must match --export below
    cli_base_args: ["-p", "{prompt}", "--model", "{model}",
                    "--export", "devin-usage.json"]
    # Add "--respect-workspace-trust", "false" only if you cannot pre-trust
    # workspace_base interactively (see the trust note above).

  # ── pi (bring-your-own-provider) ──────────────────────────────────────────
  # `pi -p --mode json` streams JSON Lines; every `turn_end` event carries a
  # `usage` block with token counts AND a USD `cost` that pi computes itself
  # from its bundled model catalog:
  #
  #   {"type":"turn_end","message":{"provider":"amazon-bedrock",
  #     "model":"global.anthropic.claude-sonnet-5",
  #     "usage":{"input":3,"output":70,"cacheRead":0,"cacheWrite":6512,
  #       "cost":{"input":0.000009,"output":0.00105,"cacheRead":0,
  #               "cacheWrite":0.02442,"total":0.025479}}}}
  #
  # The harness sums cost.total across every turn, so NO pricing block is
  # needed — same as Claude Code. Per-token rates below are optional and used
  # only as a fallback for a model the catalog does not price.
  #
  # Token semantics: `input` is the FRESH (non-cached) prompt slice, reported
  # next to cacheRead/cacheWrite, so total input = input + cacheRead + cacheWrite.
  #
  # Flags:
  #   --provider   pi defaults to `google`. Pass the provider you actually have
  #                credentials for or the first turn fails. Verify with
  #                `pi auth check --provider amazon-bedrock --json`
  #                ("status":"ready") and list ids with `pi --list-models`.
  #                A combined form also works: --model provider/model-id.
  #   --thinking   pi takes the reasoning level as a FLAG (off/minimal/low/
  #                medium/high/xhigh/max), so {effort} maps straight through —
  #                no model-slug suffix games as with Cursor/Devin/Antigravity.
  #   --no-session keeps each benchmark run stateless (no ~/.pi session file).
  #   --no-approve ignores project-local pi config/extensions/skills, so a
  #                cloned brownfield repo can't influence the run.
  # -p implies non-interactive and enables the built-in read/write/edit/bash
  # tools without approval prompts, so there is no "skip permissions" flag to
  # pass. pi writes into the process cwd, so files land in the run workspace
  # with no --add-dir equivalent needed.
  - name: pi
    display_name: "pi (claude-sonnet-5)"
    cli_path: pi
    model_id: global.anthropic.claude-sonnet-5
    cli_base_args: ["-p", "--mode", "json",
                    "--provider", "amazon-bedrock", "--model", "{model}",
                    "--thinking", "{effort}",
                    "--no-session", "--no-approve", "{prompt}"]

  # # ── OpenAI Codex (gpt-5.5) ────────────────────────────────────────────────
  # # Pricing reference: https://developers.openai.com/api/docs/pricing?latest-pricing=standard
  # # gpt-5.5 standard rates (per 1M tokens): input $5.00 / cached $0.50 / output $30.00
  # #
  # # Formula:  cost = (input - cached) / 1M × input_rate
  # #                + cached           / 1M × cached_input_rate
  # #                + output           / 1M × output_rate
  # # Note: reasoning_output_tokens is a subset of output_tokens, not extra.
  # - name: codex
  #   display_name: "OpenAI Codex (gpt-5.5)"
  #   cli_path: codex
  #   model_id: gpt-5.5
  #   pricing:
  #     usd_per_input_token:        0.000005     # $5.00  / 1M
  #     usd_per_cached_input_token: 0.0000005    # $0.50  / 1M
  #     usd_per_output_token:       0.000030     # $30.00 / 1M
  #   cli_base_args:
  #     - "exec"
  #     - "--json"
  #     - "--ephemeral"
  #     - "--skip-git-repo-check"
  #     - "--dangerously-bypass-approvals-and-sandbox"
  #     - "-m"
  #     - "{model}"
  #     - "{prompt}"

  # # ── OpenCode ──────────────────────────────────────────────────────────────
  # # Cost is parsed from `opencode run --format json` JSONL `step_finish`
  # # events (provider cost + tokens; summed across multi-step loops).
  # # Use {workspace} with --dir so OpenCode runs in the harness workspace.
  # # Non-repo workspaces are git-initialized automatically (OpenCode requires it).
  # # Adjust model_id / pricing to match your OpenCode provider setup.
  # - name: opencode
  #   display_name: "OpenCode (gpt-5.6-sol)"
  #   cli_path: opencode
  #   model_id: azure/gpt-5.6-sol
  #   pricing:
  #     usd_per_input_token:        0.000002     # $2.00  / 1M
  #     usd_per_cached_input_token: 0.0000005    # $0.50  / 1M
  #     usd_per_output_token:       0.000008     # $8.00  / 1M
  #   cli_base_args:
  #     - "run"
  #     - "--format"
  #     - "json"
  #     - "--dir"
  #     - "{workspace}"
  #     - "--model"
  #     - "{model}"
  #     - "--variant"
  #     - "{effort}"
  #     - "--auto"
  #     - "{prompt}"

# Task discovery (cli-compare is vibe-only; spec tasks are skipped)
# Leave task_ids empty to run all tasks, or list specific ones. The repo
# ships several high-complexity multi-file tasks (e.g. event-sourcing-cqrs,
# multitenant-rbac-api, multitenant-workflow-engine) that use
# functional_pass_threshold: 0.75 for partial credit — list them under
# task_ids to focus a run on them.
tasks_dir: tasks
task_ids: 
modes: ["vibe"]

# Bring your own tasks: Terminal-Bench (optional). Point `path` at the
# Terminal-Bench repo (a git URL is cloned + cached automatically — nothing to
# download by hand) or a local checkout, and the framework converts its tasks to
# native fixtures at run time and runs your CLIs against them. Imported ids are
# prefixed `terminal-bench-<name>`. Each task is graded by its OWN hidden tests
# in its own Docker image (auto-pulled/built).
#
# NOTE: this brings Terminal-Bench TASKS into this framework's host-agent model;
# it does not reproduce Terminal-Bench benchmark scores. Tasks that only produce
# files grade correctly; tasks that need the agent to mutate the container
# environment (install a runtime, build a system binary, run a service) are
# auto-detected and skipped. With no `tasks:` filter, a curated set of
# confirmed-gradeable tasks runs by default. See the README section
# "Bring your own tasks (Terminal-Bench 2.1)".
#
# When a task source is enabled it is EXCLUSIVE: only imported tasks run and the
# local `tasks/` tree is skipped. Uncomment to enable:
#
# task_sources:
#   - type: terminal-bench
#     path: https://github.com/harbor-framework/terminal-bench-2-1.git
#     ref: main            # branch, tag, or a full 40-char commit SHA (pin for reproducibility)
#     subdir: tasks        # the tasks live under this repo subdirectory
#     # tasks: [chess-best-move, write-compressor]   # optional: pick specific source
#     #   task names. Omit to use the curated harness-compatible default set.
#     # Terminal-Bench tasks carry a tight per-task timeout from their task.toml
#     # (often 15 min). Override it here to give the agent more time.
#     timeout_minutes: 20

# LLM-as-judge
judge_cli_path: kiro-cli
judge_model: claude-opus-4.8
judge_weight: 0.6

# Execution
concurrency: per_target
timeout_minutes: 20
repeats: 1
functional_pass_threshold: 0.99
# Container runtime for Docker-verified tasks defaults to `docker`. Set the
# CONTAINER_RUNTIME=finch env var to use Finch instead. When using Finch on
# macOS, set workspace_base under your home directory (e.g. ~/agent-cost-bench-runs)
# since Finch can only mount volumes from the home directory.
workspace_base: /tmp/agent-cost-bench-cli-compare
# Devin permission policy copied into every workspace as `.devin/config.json`.
# Other CLIs ignore it. Set to "" to skip the copy (Devin then falls back to its
# default Normal mode and rejects the tool calls a coding task needs).
devin_permissions_file: tasks/devin/config.json

# Reporting
output_dir: results
report_title: "Benchmark Analysis: Opus 4.8 (Kiro vs Claude Code vs Copilot vs Cursor vs Devin)"
open_report: true
